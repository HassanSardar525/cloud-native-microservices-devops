name: CD - Production

on:
  workflow_run:
    workflows: ["CI - Production"]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull production images
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest

      - name: Deploy to production
        run: |
          echo "Deploying to PRODUCTION environment..."
          echo "Environment: production"
          echo "Branch: main"
          echo "Commit: ${{ github.sha }}"

      - name: Tag release
        run: |
          echo "Production release 1.0.0 deployed successfully"
          echo "Images: hassansardar525/*:1.0.0 and hassansardar525/*:latest"

      - name: CD Success notification
        run: echo "✔ CD pipeline passed — production environment updated"