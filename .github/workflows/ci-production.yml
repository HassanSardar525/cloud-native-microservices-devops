name: CI - Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint HTML files
        run: |
          echo "Linting HTML files..."
          for file in $(find src -name "*.html"); do
            echo "Checking $file"
            if grep -q "<!DOCTYPE html>" "$file"; then
              echo "✔ $file has DOCTYPE"
            else
              echo "✘ $file missing DOCTYPE"
              exit 1
            fi
          done

      - name: Verify CSS exists in all services
        run: |
          for service in frontend user-service product-service order-service notification-service; do
            if [ -f "src/$service/style.css" ]; then
              echo "✔ src/$service/style.css found"
            else
              echo "✘ src/$service/style.css MISSING"
              exit 1
            fi
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest ./src/frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend:1.0.0 ./src/frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest ./src/user-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-service:1.0.0 ./src/user-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest ./src/product-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:1.0.0 ./src/product-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest ./src/order-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:1.0.0 ./src/order-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest ./src/notification-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:1.0.0 ./src/notification-service
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend:1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-service:1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:1.0.0
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:1.0.0

      - name: CI Success notification
        run: echo "✔ CI pipeline passed for production environment"